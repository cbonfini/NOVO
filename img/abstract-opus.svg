<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1b52"/>
      <stop offset="1" stop-color="#4b2e83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <!-- concentric rings: living works accumulating into an opus -->
  <g fill="none" stroke="#e6c65a">
    <circle cx="600" cy="450" r="70" stroke-opacity="0.9" stroke-width="2.5"/>
    <circle cx="600" cy="450" r="140" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="600" cy="450" r="215" stroke-opacity="0.4" stroke-width="1.8"/>
    <circle cx="600" cy="450" r="295" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="600" cy="450" r="380" stroke-opacity="0.14" stroke-width="1.2"/>
  </g>
  <!-- waypoints on the rings -->
  <g fill="#e6c65a">
    <circle cx="600" cy="380" r="5"/>
    <circle cx="740" cy="450" r="5"/>
    <circle cx="600" cy="665" r="5"/>
    <circle cx="385" cy="450" r="5"/>
    <circle cx="808" cy="242" r="5"/>
    <circle cx="600" cy="450" r="9" stroke="#c9a227" stroke-width="3" fill="#f4f1ea"/>
  </g>
  <g fill="none" stroke="#a98fd6" stroke-opacity="0.25" stroke-width="1.4">
    <path d="M 600 450 L 600 380 M 600 450 L 740 450 M 600 450 L 385 450 M 600 450 L 600 665 M 600 450 L 808 242"/>
  </g>
</svg>
