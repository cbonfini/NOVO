<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1233"/>
      <stop offset="0.55" stop-color="#2e1b52"/>
      <stop offset="1" stop-color="#4b2e83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- ascending arc path with six waypoints -->
  <path d="M 120 840 C 480 820, 620 620, 800 520 S 1250 300, 1480 190" fill="none" stroke="#e6c65a" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="1 9" stroke-linecap="round"/>
  <g fill="none" stroke="#e6c65a" stroke-opacity="0.9" stroke-width="2.5">
    <circle cx="120" cy="840" r="13"/>
    <circle cx="420" cy="770" r="13"/>
    <circle cx="690" cy="590" r="13"/>
    <circle cx="960" cy="440" r="13"/>
    <circle cx="1220" cy="310" r="13"/>
    <circle cx="1480" cy="190" r="17" fill="#c9a227" fill-opacity="0.9"/>
  </g>
  <g fill="#e6c65a" fill-opacity="0.9">
    <circle cx="120" cy="840" r="4.5"/>
    <circle cx="420" cy="770" r="4.5"/>
    <circle cx="690" cy="590" r="4.5"/>
    <circle cx="960" cy="440" r="4.5"/>
    <circle cx="1220" cy="310" r="4.5"/>
  </g>
  <!-- faint concentric rings, suggesting the opus accumulating -->
  <g fill="none" stroke="#a98fd6" stroke-opacity="0.16">
    <circle cx="1480" cy="190" r="60" stroke-width="1.5"/>
    <circle cx="1480" cy="190" r="110" stroke-width="1.2"/>
    <circle cx="1480" cy="190" r="170" stroke-width="1"/>
  </g>
  <!-- quiet horizon line -->
  <line x1="0" y1="910" x2="1600" y2="910" stroke="#a98fd6" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
