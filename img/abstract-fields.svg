<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1b52"/>
      <stop offset="1" stop-color="#1c1233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#6b4bb0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6b4bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- five columns rising from a shared base: five fields, one purpose -->
  <g stroke-linecap="round">
    <line x1="330" y1="820" x2="330" y2="470" stroke="#e6c65a" stroke-opacity="0.75" stroke-width="3"/>
    <line x1="565" y1="820" x2="565" y2="360" stroke="#3fae77" stroke-opacity="0.75" stroke-width="3"/>
    <line x1="800" y1="820" x2="800" y2="250" stroke="#e6c65a" stroke-opacity="0.9" stroke-width="3"/>
    <line x1="1035" y1="820" x2="1035" y2="360" stroke="#a98fd6" stroke-opacity="0.75" stroke-width="3"/>
    <line x1="1270" y1="820" x2="1270" y2="470" stroke="#e6c65a" stroke-opacity="0.75" stroke-width="3"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <circle cx="330" cy="440" r="15" stroke="#e6c65a"/>
    <circle cx="565" cy="330" r="15" stroke="#3fae77"/>
    <circle cx="800" cy="220" r="19" stroke="#e6c65a" fill="#c9a227" fill-opacity="0.85"/>
    <circle cx="1035" cy="330" r="15" stroke="#a98fd6"/>
    <circle cx="1270" cy="440" r="15" stroke="#e6c65a"/>
  </g>
  <line x1="180" y1="820" x2="1420" y2="820" stroke="#a98fd6" stroke-opacity="0.3" stroke-width="2"/>
  <!-- connecting arc across the tops -->
  <path d="M 330 440 Q 565 300 800 220 Q 1035 300 1270 440" fill="none" stroke="#e6c65a" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="1 8"/>
</svg>
