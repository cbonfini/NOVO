<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1233"/>
      <stop offset="0.6" stop-color="#2e1b52"/>
      <stop offset="1" stop-color="#0f3d2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e6c65a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e6c65a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- five nodes around a shared table (circle), joined by chords -->
  <g stroke="#e6c65a" stroke-opacity="0.35" stroke-width="1.6" fill="none">
    <path d="M 800 180 L 1180 480 L 1010 860 L 590 860 L 420 480 Z"/>
    <path d="M 800 180 L 1010 860 M 800 180 L 590 860 M 420 480 L 1180 480 M 420 480 L 1010 860 M 1180 480 L 590 860"/>
  </g>
  <circle cx="800" cy="530" r="210" fill="none" stroke="#a98fd6" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="800" cy="530" r="300" fill="none" stroke="#a98fd6" stroke-opacity="0.12" stroke-width="1.2"/>
  <g>
    <g fill="#2e1b52" stroke="#e6c65a" stroke-width="2.5">
      <circle cx="800" cy="180" r="17"/>
      <circle cx="1180" cy="480" r="17"/>
      <circle cx="1010" cy="860" r="17"/>
      <circle cx="590" cy="860" r="17"/>
      <circle cx="420" cy="480" r="17"/>
    </g>
    <g fill="#e6c65a">
      <circle cx="800" cy="180" r="5.5"/>
      <circle cx="1180" cy="480" r="5.5"/>
      <circle cx="1010" cy="860" r="5.5"/>
      <circle cx="590" cy="860" r="5.5"/>
      <circle cx="420" cy="480" r="5.5"/>
    </g>
  </g>
  <!-- faint latitude arcs, suggesting the globe -->
  <g fill="none" stroke="#3fae77" stroke-opacity="0.2" stroke-width="1.5">
    <path d="M 60 250 Q 800 90 1540 250"/>
    <path d="M 20 760 Q 800 940 1580 760"/>
  </g>
</svg>
